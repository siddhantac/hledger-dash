services:
  hledger-dash:
    build: .
    ports:
      - "9099:9099"
    volumes:
      - journals:/journals:ro
    environment:
      - HLEDGER_FILE=/journals/${JOURNAL_FILE:-main.journal}
    restart: unless-stopped
    depends_on:
      - journal-sync

  journal-sync:
    image: alpine/git
    working_dir: /journals
    volumes:
      - journals:/journals
      - ${SSH_KEY_PATH:-~/.ssh/id_ed25519}:/root/.ssh/id_ed25519:ro
      - ${SSH_KNOWN_HOSTS_PATH:-~/.ssh/known_hosts}:/root/.ssh/known_hosts:ro
    environment:
      - JOURNAL_REPO=${JOURNAL_REPO}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -d .git ]; then
          echo "Cloning $$JOURNAL_REPO ..."
          git clone $$JOURNAL_REPO .
        fi
        while true; do
          git pull --ff-only && echo "[$(date)] Pulled OK" || echo "[$(date)] Pull failed"
          sleep 300
        done
    restart: unless-stopped

volumes:
  journals:
